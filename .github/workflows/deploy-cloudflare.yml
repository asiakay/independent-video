name: Deploy Independent Video

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  D1_DATABASE_NAME: independent-video

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest

      - name: Resolve or create D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1-list.json
          DB_ID=$(node -e "const fs=require('fs');const rows=JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));const db=rows.find(x=>x.name===process.env.D1_DATABASE_NAME);if(db)process.stdout.write(db.uuid||db.id||'')")
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create "$D1_DATABASE_NAME" --location enam > /tmp/d1-create.txt
            npx wrangler d1 list --json > /tmp/d1-list.json
            DB_ID=$(node -e "const fs=require('fs');const rows=JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));const db=rows.find(x=>x.name===process.env.D1_DATABASE_NAME);if(!db)process.exit(1);process.stdout.write(db.uuid||db.id)")
          fi
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Patch Wrangler D1 binding for deployment
        env:
          DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.jsonc';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.d1_databases = [{ binding: 'DB', database_name: 'independent-video', database_id: process.env.DATABASE_ID }];
          config.assets = { directory: './apps/studio', binding: 'ASSETS', run_worker_first: ['/api/*', '/health'] };
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Run D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote

      - name: Seed Creator 001 and Channel 001
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute "$D1_DATABASE_NAME" --remote --file=database/seeds/creator_001.sql

      - name: Upload Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_STREAM_API_TOKEN: ${{ secrets.CLOUDFLARE_STREAM_API_TOKEN }}
          CLOUDFLARE_STREAM_CUSTOMER_CODE: ${{ secrets.CLOUDFLARE_STREAM_CUSTOMER_CODE }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx wrangler secret put CLOUDFLARE_ACCOUNT_ID
          printf '%s' "$CLOUDFLARE_STREAM_API_TOKEN" | npx wrangler secret put CLOUDFLARE_STREAM_API_TOKEN
          printf '%s' "$CLOUDFLARE_STREAM_CUSTOMER_CODE" | npx wrangler secret put CLOUDFLARE_STREAM_CUSTOMER_CODE

      - name: Deploy Worker and Studio static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Persist D1 database ID in repository config
        env:
          DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet -- wrangler.jsonc; then
            exit 0
          fi
          git add wrangler.jsonc
          git commit -m "chore: persist Cloudflare D1 binding"
          git push
